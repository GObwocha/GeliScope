<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeliScope</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (for new Landing Page) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        corePlugins: {
          preflight: false,
        },
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0B1120',
                card: '#111827',
                cardBorder: 'rgba(255, 255, 255, 0.08)',
                purple: '#8B5CF6',
                cyan: '#22D3EE',
                lavender: '#C4B5FD',
                muted: '#94A3B8'
              }
            },
            fontFamily: {
              heading: ['Outfit', 'sans-serif'],
              body: ['Spline Sans', 'sans-serif']
            }
          }
        }
      }
    </script>

    <!-- Primary Meta Tags -->
    <meta name="title" content="GeliScope">
    <meta name="description" content="Automated exam marking and AI-driven performance tracking for teachers, students, and parents.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://geliscope.com/">
    <meta property="og:title" content="GeliScope">
    <meta property="og:description" content="Automated exam marking and AI-driven performance tracking for teachers, students, and parents.">
    <meta property="og:image" content="https://geliscope.com/FullLogo.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://geliscope.com/">
    <meta property="twitter:title" content="GeliScope">
    <meta property="twitter:description" content="Automated exam marking and AI-driven performance tracking for teachers, students, and parents.">
    <meta property="twitter:image" content="https://geliscope.com/FullLogo.jpg">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
